<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas — Rastreador de precios</title>
<style>
  /* El vocabulario visual sale del retail chileno: la etiqueta amarilla de
     góndola con tinta negra, y la lista de precios con guía punteada. Sin una
     sola fuente web ni un archivo externo —la regla del proyecto es que esta
     página se sirva sola—, así que la personalidad tiene que salir de pilas de
     fuentes del sistema y de CSS. */
  :root {
    --papel: #e9ebee;
    --papel-alto: #f7f8fa;
    --tinta: #15171c;
    --tinta-suave: #5c6472;
    --filete: #d2d6dd;
    --oferta: #f5b301;
    --oferta-borde: #c08b00;
    --oferta-tinta: #15171c;
    --enlace: #1b4fa0;
    --trama: rgba(21, 23, 28, .035);
    --velo: rgba(255, 255, 255, .55);
    --radio: 3px;
    --sombra-pegatina: 0 2px 0 var(--oferta-borde), 0 7px 16px rgba(0, 0, 0, .16);

    /* Condensada y pesada para los montos: es la letra de una etiqueta de
       precio, y las cifras tabulares hacen que las columnas cuadren. */
    --condensada: "Arial Narrow", "Helvetica Neue Condensed", "Liberation Sans Narrow",
                  "Segoe UI", system-ui, sans-serif;
    --texto: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #121419;
      --papel-alto: #1b1e25;
      --tinta: #e9ecf2;
      --tinta-suave: #99a1b0;
      --filete: #2b3038;
      --oferta: #ffc425;
      --oferta-borde: #93700a;
      --oferta-tinta: #15171c;
      --enlace: #86b4ff;
      --trama: rgba(255, 255, 255, .03);
      --velo: rgba(255, 255, 255, .05);
      --sombra-pegatina: 0 2px 0 var(--oferta-borde), 0 7px 18px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--texto);
    line-height: 1.45;
  }

  /* El papel: dos tramas finísimas y un velo que cae desde arriba. Pesa cero
     bytes y evita el plano liso de siempre. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      repeating-linear-gradient(90deg, var(--trama) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, var(--trama) 0 1px, transparent 1px 4px),
      radial-gradient(130% 70% at 50% -10%, var(--velo), transparent 65%);
  }

  a { color: var(--enlace); }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1rem .75rem;
  }

  header h1 {
    margin: 0;
    font-family: var(--condensada);
    font-weight: 700;
    font-size: clamp(2rem, 1.3rem + 3.2vw, 3.1rem);
    letter-spacing: -.015em;
    line-height: .95;
  }

  /* El filo amarillo bajo el título es el mismo que marca una tarjeta rebajada:
     el color significa lo mismo en los dos sitios. */
  header h1::after {
    content: "";
    display: block;
    width: 2.4rem;
    height: 5px;
    margin-top: .5rem;
    background: var(--oferta);
  }

  #sincronizacion {
    margin: .6rem 0 0;
    color: var(--tinta-suave);
    font-size: .82rem;
  }

  #sincronizacion.falla {
    display: inline;
    background: var(--oferta);
    color: var(--oferta-tinta);
    box-shadow: -.35rem 0 0 var(--oferta), .35rem 0 0 var(--oferta);
    font-weight: 600;
  }

  .panel {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .controles {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    align-items: center;
    padding: .7rem;
    background: var(--papel-alto);
    border: 1px solid var(--filete);
    border-radius: var(--radio);
  }

  .controles input[type="search"],
  .controles input[type="number"],
  .controles select {
    border: 1px solid var(--filete);
    border-radius: var(--radio);
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--texto);
    font-size: .9rem;
    padding: .45rem .55rem;
  }

  .controles input::placeholder { color: var(--tinta-suave); }

  :focus-visible {
    outline: 2px solid var(--oferta-borde);
    outline-offset: 2px;
  }

  #buscar { flex: 1 1 220px; min-width: 0; }

  .precio-rango { display: flex; gap: .4rem; flex: 1 1 200px; }
  .precio-rango input { width: 100%; min-width: 0; }

  /* --- Las tiendas, como etiquetas colgadas de su agujero --- */

  fieldset.tiendas-caja {
    border: 0;
    border-top: 1px solid var(--filete);
    padding: .85rem 0 0;
    margin: 1rem 0 .6rem;
  }

  fieldset.tiendas-caja legend {
    padding: 0 .5rem 0 0;
    color: var(--tinta-suave);
    font-size: .8rem;
  }

  #tiendas {
    display: flex;
    flex-wrap: wrap;
    gap: .45rem;
  }

  .etiqueta-tienda {
    cursor: pointer;
    line-height: 1;
  }

  .etiqueta-tienda .tienda {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* La etiqueta de verdad: papel, filete, y el troquel por donde iría el hilo. */
  .pieza {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .34rem .6rem .34rem .5rem;
    background: var(--papel-alto);
    border: 1px solid var(--filete);
    border-radius: var(--radio);
    color: var(--tinta);
    font-size: .85rem;
    transition: transform .12s ease, background-color .12s ease, box-shadow .12s ease;
  }

  .pieza::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--papel);
    box-shadow: inset 0 0 0 1px var(--filete);
  }

  .cuenta {
    font-family: var(--condensada);
    font-variant-numeric: tabular-nums;
    font-size: .95rem;
    color: var(--tinta-suave);
  }

  .etiqueta-tienda:hover .pieza { transform: translateY(-1px); }

  .tienda:checked ~ .pieza {
    background: var(--oferta);
    border-color: var(--oferta-borde);
    color: var(--oferta-tinta);
    box-shadow: 0 2px 0 var(--oferta-borde);
  }

  .tienda:checked ~ .pieza .cuenta { color: var(--oferta-tinta); }
  .tienda:checked ~ .pieza::before { box-shadow: inset 0 0 0 1px var(--oferta-borde); }
  .tienda:focus-visible ~ .pieza { outline: 2px solid var(--oferta-borde); outline-offset: 2px; }

  /* Quitar los filtros no es una tienda: va sin troquel. */
  button.pieza { font: inherit; font-size: .85rem; cursor: pointer; }
  .pieza.todas { padding-left: .6rem; font-weight: 600; }
  .pieza.todas::before { display: none; }

  /* Cuarenta etiquetas en una pantalla de móvil son ocho filas antes de ver
     una sola oferta. Se quedan en su propia caja con desplazamiento: siguen
     todas ahí, pero no entierran lo que se viene a mirar. */
  @media (max-width: 620px) {
    #tiendas {
      max-height: 7.4rem;
      overflow-y: auto;
      padding: .1rem .3rem .1rem .1rem;
      border: 1px solid var(--filete);
      border-radius: var(--radio);
      background: var(--papel-alto);
    }
  }

  #cuantos {
    margin: 0 0 .9rem;
    color: var(--tinta-suave);
    font-size: .82rem;
  }

  /* --- Las tarjetas --- */

  .resultados {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.15rem .9rem;
    padding-bottom: 3rem;
  }

  @media (min-width: 620px) {
    .resultados { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  }

  .tarjeta {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    padding: .85rem .9rem;
    background: var(--papel-alto);
    border: 1px solid var(--filete);
    border-left: 3px solid var(--filete);
    border-radius: var(--radio);
  }

  /* El amarillo solo aparece donde hay una bajada medida por nosotros. */
  .tarjeta.rebajada { border-left-color: var(--oferta); }

  .tarjeta.agotado {
    opacity: .6;
    filter: grayscale(.5);
  }

  .tarjeta h2 {
    margin: 0;
    padding-right: 3.6rem;
    font-family: var(--condensada);
    font-weight: 700;
    font-size: 1.12rem;
    letter-spacing: -.005em;
    line-height: 1.15;
  }

  /* El título no se pinta de azul: el único color de esta página es el amarillo
     de la etiqueta, y un enlace azul por tarjeta se lo comería. */
  .tarjeta h2 a { color: inherit; text-decoration: none; }
  .tarjeta h2 a:hover { text-decoration: underline; }

  /* La pegatina: lo único girado y lo único con sombra de toda la página. */
  .insignia {
    position: absolute;
    top: -.6rem;
    right: .7rem;
    background: var(--oferta);
    color: var(--oferta-tinta);
    font-family: var(--condensada);
    font-weight: 700;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    padding: .1rem .45rem .16rem;
    border-radius: 2px;
    transform: rotate(-2.5deg);
    box-shadow: var(--sombra-pegatina);
  }

  .antes {
    margin: 0;
    color: var(--tinta-suave);
    font-size: .78rem;
  }

  .antes .viejo { text-decoration: line-through; }

  .destacado {
    display: flex;
    align-items: baseline;
    gap: .45rem;
    flex-wrap: wrap;
  }

  .precio {
    font-family: var(--condensada);
    font-weight: 700;
    font-size: clamp(1.7rem, 1.3rem + 1.4vw, 2.15rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    line-height: 1;
  }

  .donde { color: var(--tinta-suave); font-size: .85rem; }

  .otras {
    list-style: none;
    margin: 0;
    padding: .5rem 0 0;
    border-top: 1px solid var(--filete);
    display: flex;
    flex-direction: column;
    gap: .25rem;
    font-size: .85rem;
  }

  /* Guía punteada entre el nombre y el monto, como en una lista de precios. */
  .fila-tienda { display: flex; align-items: baseline; gap: .4rem; }
  .fila-tienda .guia { flex: 1; border-bottom: 1px dotted var(--filete); }
  .fila-tienda .monto { font-variant-numeric: tabular-nums; }
  .fila-tienda.sin-stock { color: var(--tinta-suave); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Ofertas</h1>
  <p id="sincronizacion">Cargando…</p>
</header>

<div class="panel">
  <div class="controles">
    <input type="search" id="buscar" placeholder="Buscar por título…" aria-label="Buscar por título">

    <select id="descuento" aria-label="Descuento mínimo">
      <option value="0">Cualquier descuento</option>
      <option value="10">10 % o más</option>
      <option value="30">30 % o más</option>
      <option value="50">50 % o más</option>
    </select>

    <div class="precio-rango">
      <input type="number" id="precio-min" min="0" placeholder="Precio mínimo" aria-label="Precio mínimo">
      <input type="number" id="precio-max" min="0" placeholder="Precio máximo" aria-label="Precio máximo">
    </div>

    <select id="orden" aria-label="Ordenar por">
      <option value="descuento">Mayor descuento</option>
      <option value="reciente">Bajada más reciente</option>
      <option value="precio">Menor precio</option>
    </select>
  </div>

  <fieldset class="tiendas-caja">
    <legend>Tiendas</legend>
    <div id="tiendas"></div>
  </fieldset>

  <p id="cuantos" aria-live="polite"></p>

  <div id="resultados" class="resultados"></div>
</div>

<script>
  // El nombre del archivo lo inyecta el generador, para que la página no dependa
  // de dónde se sirva.
  const ORIGEN = "__DATOS__";
  const MEDIA_HORA = 30 * 60 * 1000;

  let ofertas = [];
  let ultimaSincronizacion = null;   // la última vez que los datos llegaron bien

  function horaDeAhora() {
    // `hour12: false` explícito: sin él el navegador saca «09:30 p. m.», y en
    // Chile la hora se escribe de 0 a 23.
    return new Date().toLocaleTimeString("es-CL", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    });
  }

  function pesos(n) {
    // 887990 -> "$887.990", como se escribe en Chile.
    return "$" + n.toLocaleString("es-CL");
  }

  function dia(marca) {
    // "2026-10-09 18:20" viene en UTC: la base guarda `datetime('now')`. Cortar
    // los diez primeros caracteres enseñaría el día equivocado para todo lo
    // capturado después de las 21:00 de Chile. Se convierte a la hora del
    // navegador, que es donde está quien mira.
    if (!marca) return "";
    const f = new Date(marca.replace(" ", "T") + "Z");
    const dd = String(f.getDate()).padStart(2, "0");
    const mm = String(f.getMonth() + 1).padStart(2, "0");
    return `${dd}/${mm}`;
  }

  function urlSegura(url) {
    // La URL la escribe la tienda. Un `javascript:` en un `href` se ejecuta al
    // pulsar, y esta página es pública. El título lo protege `textContent`; la
    // URL hay que mirarla a mano.
    return /^https?:\/\//i.test(String(url || "")) ? url : null;
  }

  function plano(texto) {
    // Buscar "cafe" tiene que encontrar "Café": las tildes las ponen las
    // tiendas en sus títulos, no quien busca.
    return String(texto).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  async function cargar() {
    const aviso = document.getElementById("sincronizacion");
    try {
      const r = await fetch(ORIGEN + "?t=" + Date.now()); // sin caché del navegador
      if (!r.ok) throw new Error("respuesta " + r.status);
      const datos = await r.json();
      ofertas = datos.ofertas;
      ultimaSincronizacion = horaDeAhora();
      aviso.classList.remove("falla");
      aviso.textContent =
        `${datos.productos} productos de ${datos.tiendas} tiendas. Precios del ` +
        `${datos.generado_el} UTC, revisados a las ${ultimaSincronizacion}.`;
      poblarTiendas();
      pintar();
    } catch (error) {
      // Un fallo de red no puede dejar la página muda. Si ya hubo datos alguna
      // vez, se quedan en pantalla y se avisa de que son viejos; si nunca
      // llegaron, se dice por qué no hay nada que mirar en vez de dejar un
      // «Cargando…» eterno.
      aviso.classList.add("falla");
      aviso.textContent = ultimaSincronizacion
        ? `Sin conexión con los datos. Lo que ves es de las ${ultimaSincronizacion}.`
        : "No se pudieron cargar los datos. Se reintenta solo en 30 minutos.";
    }
  }

  function poblarTiendas() {
    // Una etiqueta por tienda, con cuántas ofertas trae cada una. Se conserva
    // lo que ya estaba marcado, para que el refresco automático no borre el
    // filtro que eligió la persona que mira la página.
    const contenedor = document.getElementById("tiendas");
    const marcadas = new Set(
      [...contenedor.querySelectorAll(".tienda:checked")].map((c) => c.value)
    );
    contenedor.replaceChildren();

    const cuentas = new Map();
    for (const o of ofertas) cuentas.set(o.tienda, (cuentas.get(o.tienda) || 0) + 1);
    const distintas = [...cuentas.keys()].sort();

    // Con cuarenta tiendas, desmarcarlas una a una es trabajo que la página
    // puede ahorrarle a quien la mira.
    const limpiar = document.createElement("button");
    limpiar.type = "button";
    limpiar.className = "pieza todas";
    limpiar.textContent = `todas (${distintas.length})`;
    limpiar.addEventListener("click", () => {
      for (const c of contenedor.querySelectorAll(".tienda")) c.checked = false;
      pintar();
    });
    contenedor.appendChild(limpiar);

    for (const nombre of distintas) {
      const etiqueta = document.createElement("label");
      etiqueta.className = "etiqueta-tienda";

      const casilla = document.createElement("input");
      casilla.type = "checkbox";
      casilla.className = "tienda";
      casilla.value = nombre;
      casilla.checked = marcadas.has(nombre);
      casilla.addEventListener("change", pintar);
      etiqueta.appendChild(casilla);

      // La casilla real queda oculta pero enfocable; lo que se ve y se pulsa es
      // esta pieza, que es la etiqueta de góndola con su troquel.
      const pieza = document.createElement("span");
      pieza.className = "pieza";

      const texto = document.createElement("span");
      texto.textContent = nombre;
      pieza.appendChild(texto);

      const cuenta = document.createElement("span");
      cuenta.className = "cuenta";
      cuenta.textContent = cuentas.get(nombre);
      pieza.appendChild(cuenta);

      etiqueta.appendChild(pieza);
      contenedor.appendChild(etiqueta);
    }
  }
  function agrupar(lista, criterio) {
    // Mismo artículo en varias tiendas = una tarjeta. Los que no tienen
    // identificador van sueltos: agruparlos por título sería adivinar, y este
    // proyecto no empareja por parecido.
    const grupos = new Map();
    for (const o of lista) {
      const clave = o.articulo === null ? `suelto:${o.tienda}:${o.url}` : `art:${o.articulo}`;
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(o);
    }
    // Dentro de la tarjeta manda la primera fila: da el título, el enlace y la
    // insignia. Tiene que ser la que puso al grupo donde está, o la tarjeta de
    // arriba del todo en «Mayor descuento» saldría sin descuento ninguno.
    for (const filas of grupos.values()) filas.sort(criterio);
    return [...grupos.values()];
  }

  function hayStock(filas) {
    // Un artículo está disponible si lo está en alguna tienda, no solo en la
    // fila que encabeza la tarjeta.
    return filas.some((f) => f.disponible);
  }

  function tarjeta(filas) {
    // TODO EL PINTADO CON textContent, nada de pintar con marcado directo: los
    // títulos vienen de las tiendas y traen comillas, `&` y signos de menor que.
    const mejor = filas[0];
    const art = document.createElement("article");
    art.className =
      "tarjeta" +
      (hayStock(filas) ? "" : " agotado") +
      (mejor.descuento_pct > 0 ? " rebajada" : "");

    const h = document.createElement("h2");
    const destino = urlSegura(mejor.url);
    if (destino) {
      const enlace = document.createElement("a");
      enlace.href = destino;
      enlace.target = "_blank";
      enlace.rel = "noopener noreferrer";
      enlace.textContent = mejor.titulo;
      h.appendChild(enlace);
    } else {
      // Sin enlace, pero con título: la oferta sigue siendo información útil.
      h.textContent = mejor.titulo;
    }
    art.appendChild(h);

    if (mejor.descuento_pct > 0) {
      const insignia = document.createElement("span");
      insignia.className = "insignia";
      insignia.textContent = `−${mejor.descuento_pct} %`;
      art.appendChild(insignia);
    }

    // El monto es lo que se viene a mirar: va grande y en cifras tabulares.
    const destacado = document.createElement("p");
    destacado.className = "destacado";

    const precio = document.createElement("span");
    precio.className = "precio";
    precio.textContent = pesos(mejor.precio);
    destacado.appendChild(precio);

    const donde = document.createElement("span");
    donde.className = "donde";
    donde.textContent = mejor.disponible
      ? `${mejor.tienda}, ${dia(mejor.fecha)}`
      : `${mejor.tienda} (agotado)`;
    destacado.appendChild(donde);
    art.appendChild(destacado);

    if (mejor.descuento_pct > 0) {
      const antes = document.createElement("p");
      antes.className = "antes";

      const rotulo = document.createElement("span");
      rotulo.textContent = "antes ";
      antes.appendChild(rotulo);

      const viejo = document.createElement("span");
      viejo.className = "viejo";
      viejo.textContent = pesos(mejor.precio_anterior);
      antes.appendChild(viejo);

      const cuando = document.createElement("span");
      cuando.textContent = `, el ${dia(mejor.fecha_anterior)}`;
      antes.appendChild(cuando);

      art.appendChild(antes);
    }

    // Las demás tiendas del mismo artículo, con guía punteada hasta el monto,
    // como en una lista de precios.
    if (filas.length > 1) {
      const ul = document.createElement("ul");
      ul.className = "otras";
      for (const f of filas.slice(1)) {
        const li = document.createElement("li");
        li.className = "fila-tienda" + (f.disponible ? "" : " sin-stock");

        const nombre = document.createElement("span");
        nombre.textContent = f.disponible ? f.tienda : `${f.tienda} (agotado)`;
        li.appendChild(nombre);

        const guia = document.createElement("span");
        guia.className = "guia";
        li.appendChild(guia);

        const monto = document.createElement("span");
        monto.className = "monto";
        monto.textContent = pesos(f.precio);
        li.appendChild(monto);

        ul.appendChild(li);
      }
      art.appendChild(ul);
    }
    return art;
  }
  function pintar() {
    const texto = plano(document.getElementById("buscar").value.trim());
    const minDesc = Number(document.getElementById("descuento").value);
    const minPrecio = Number(document.getElementById("precio-min").value) || 0;
    const maxPrecio = Number(document.getElementById("precio-max").value) || Infinity;
    const tiendas = [...document.querySelectorAll(".tienda:checked")].map((c) => c.value);

    let visibles = ofertas.filter(
      (o) =>
        (!texto || plano(o.titulo).includes(texto)) &&
        o.descuento_pct >= minDesc &&
        o.precio >= minPrecio &&
        o.precio <= maxPrecio &&
        (tiendas.length === 0 || tiendas.includes(o.tienda))
    );

    const orden = document.getElementById("orden").value;
    const criterios = {
      descuento: (a, b) => b.descuento_pct - a.descuento_pct,
      reciente: (a, b) => (b.fecha || "").localeCompare(a.fecha || ""),
      precio: (a, b) => a.precio - b.precio,
    };
    visibles.sort(criterios[orden]);

    // Los agotados, al final, pase lo que pase con el orden elegido.
    const grupos = agrupar(visibles, criterios[orden]).sort(
      (a, b) => Number(hayStock(b)) - Number(hayStock(a))
    );

    const destino = document.getElementById("resultados");
    destino.replaceChildren(...grupos.map(tarjeta));
    document.getElementById("cuantos").textContent =
      `${visibles.length} ofertas en ${grupos.length} artículos`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    for (const id of ["buscar", "descuento", "precio-min", "precio-max", "orden"]) {
      document.getElementById(id).addEventListener("input", pintar);
    }
    cargar();
    setInterval(cargar, MEDIA_HORA);
  });
</script>

</body>
</html>
