vigilados:
  - nombre: Home Panel Mónaco TV 55
    tienda: paris
    url: https://www.paris.cl/home-panel-monaco-tv-55-1-6-castano-off-white-MK2GCAHDUR.html
    reglas:
      precio_maximo: 200000
      descuento_minimo_pct: 15
      permitir_precio_tarjeta: false

busquedas:
  # Paris, desactivado el 2026-10-12. Responde 403 a las direcciones de centro
  # de datos: funciona desde una red doméstica y no desde GitHub. Medido con
  # `herramientas/sonda_entorno.py`. El adaptador `src/fuentes/paris.py` NO se
  # ha tocado y sigue probado: descomentar estas cuatro líneas lo devuelve.
  # - termino: notebook 16gb
  #   tienda: paris
  #   reglas:
  #     precio_maximo: 400000

  # «notebook 16gb» devolvía casi solo reacondicionados de marketplace, cuyas
  # fichas no se pueden confirmar: su `sellerSkuId` es el código interno del
  # vendedor (`t14`), no un número de Falabella, así que el anclaje nunca casa.
  # «notebook» saca producto de la propia tienda, que sí confirma.
  - termino: notebook
    tienda: falabella
    reglas:
      precio_maximo: 700000
      permitir_precio_tarjeta: false

  # --- Rastreo amplio por categorías de SoloTodo ---
  #
  # Una petición por categoría trae hasta 100 productos CON su precio, así que
  # vigilar 18 categorías cuesta 18 peticiones: menos que una sola búsqueda en
  # Paris, donde cada ficha se paga aparte.
  #
  # La regla es `descuento_minimo_pct` y no `precio_maximo` a propósito. Un
  # techo de precio no significa nada cuando mezclas refrigeradores con
  # perfumes: lo que vale para uno es absurdo para el otro. El descuento sí es
  # comparable entre categorías.
  #
  # CONSECUENCIA QUE HAY QUE SABER: el descuento se mide contra el mínimo
  # histórico REAL, no contra el precio tachado de la tienda. Un producto
  # descubierto hoy no tiene histórico, así que no puede alertar hasta pasados
  # `dias_minimos_para_descuento` días (hoy 7). Es el precio de no creerse los
  # «antes» inventados. Las primeras pasadas son silenciosas y eso es correcto.
  #
  # La palabra clave NO se usa aquí: `search=notebook` devuelve 8.167 entidades
  # y las primeras son discos, ratones e impresoras. La categoría sí filtra, y
  # una categoría inexistente devuelve 400, así que una errata falla ruidosa.

  - tienda: solotodo          # Notebooks
    fuente: solotodo
    categoria: 1
    reglas:
      descuento_minimo_pct: 20

