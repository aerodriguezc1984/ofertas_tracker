ejecucion:
  espera_entre_peticiones_seg: [2, 5]
  reintentos: 3
  limite_por_busqueda: 15
historico:
  ventana_minimo_dias: 90
  dias_minimos_para_descuento: 7
alertas:
  canal: telegram         # archivo | telegram
  cooldown_dias: 5
  ruta_archivo: logs/alertas.jsonl
solotodo:
  # Las tiendas que ya cubrimos con un adaptador directo. SoloTodo las ignora:
  # su `external_url` es el mismo que el nuestro, así que caerían en la misma
  # fila discrepando en el precio de tarjeta, y el histórico crecería una fila
  # por ciclo sin que nada hubiera cambiado.
  #
  # Esta lista vive en TRES sitios y nada los ata entre sí: aquí, en las claves
  # del diccionario `fuentes` de runner.py, y en el conjunto `directas` de
  # herramientas/sonda_solotodo.py. Quien añada un adaptador directo nuevo
  # tiene que tocar los tres; si se olvida de este, SoloTodo y el adaptador
  # capturarán el mismo artículo en la misma fila, discreparán en el precio de
  # tarjeta, y el histórico crecerá una fila por ciclo sin que ningún precio se
  # haya movido.
  #
  # Hay un CUARTO consumidor, aparte de estos tres: la auto-exclusión de la
  # comparación (`mejor_oferta`, en nucleo/comparacion.py) compara
  # `oferta.tienda` contra `productos.tienda` para no ofrecernos como
  # alternativa a nosotros mismos. Eso depende de que el nombre de tienda que
  # normaliza SoloTodo siga coincidiendo carácter a carácter con nuestro
  # identificador de tienda. Si dejaran de coincidir, además del histórico
  # creciendo, la comparación avisaría de que tu producto de Paris está más
  # barato en Paris, con un enlace a la misma tienda.
  tiendas_excluidas: [paris, falabella]
comparacion:
  activa: true
  # Se exigen LOS DOS umbrales, no uno: sin el absoluto un mouse de 8.000 pesos
  # avisa por 800, y sin el relativo un notebook de 900.000 avisa por 10.000.
  caida_minima_pct: 10
  ahorro_minimo_pesos: 10000
  # Una petición por producto y por ciclo, al ritmo lento del transporte. Los
  # que llevan más tiempo sin comparar van primero, así que nadie se queda sin
  # turno aunque el tope sea bajo.
  maximo_por_ciclo: 25
  cooldown_dias: 5
